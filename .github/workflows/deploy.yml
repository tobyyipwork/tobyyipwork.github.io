name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site/ecard
          cp -r sage/ecard/* _site/ecard/
          cp .nojekyll _site/.nojekyll
          echo test > _site/health.txt
          mkdir -p _site/foo/sub
          echo foo > _site/foo/bar.txt
          echo deep > _site/foo/sub/deep.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4